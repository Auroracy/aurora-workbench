name: Daily XWLB Summary

on:
  schedule:
    # UTC 12:00 = 北京 20:00（CCTV《新闻联播》播出 30 分钟后）
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '补录日期 YYYY-MM-DD（留空=当日）。注意：CCTV 栏目页只保留当日节目，历史日期必须用 Tab9「手动粘贴」'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch-xwlb:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch CCTV《新闻联播》& generate AI summary
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="--date=${{ inputs.date }}"
            echo "📅 手动补录日期: ${{ inputs.date }}"
          else
            echo "📅 自动运行：取当日节目单"
          fi
          node scripts/fetch-xwlb.mjs $ARGS

      - name: Commit & push
        run: |
          git config user.name 'aurora-bot'
          git config user.email 'aurora-bot@users.noreply.github.com'
          git add data/xwlb/
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          DATE=$(ls -1 data/xwlb/ | sort | tail -1 | sed 's/\.json$//')
          # 检查是否为 skipped 标记（抓取失败）
          if grep -q '"_skipped": true' "data/xwlb/${DATE}.json" 2>/dev/null; then
            REASON=$(node -e "const d=require('./data/xwlb/${DATE}.json'); console.log(d._reason||'unknown')")
            git commit -m "xwlb: ${DATE} 跳过（${REASON}）"
            echo "⚠️ 已提交跳过标记: ${DATE}"
          else
            git commit -m "xwlb: ${DATE} 央视《新闻联播》AI 总结"
          fi
          git push
